server {
    # listen will be templated at container start to the PORT env var (0.0.0.0:PORT)
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Buffer optimization - Fix "400 Bad Request: Request Header Or Cookie Too Large"
    client_body_buffer_size 128k;
    client_max_body_size 50M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 32k;
    
    # Timeouts
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Gzip compression
    gzip on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # Cache static assets aggressively
    location ~* \.(?:css|js|map|jpg|jpeg|gif|png|ico|svg|woff2?|ttf|eot)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # Use TCP php-fpm pass on localhost:9000 for compatibility inside the container
        fastcgi_pass app:9000;
        fastcgi_index index.php;
    }

    sendfile on;
    tcp_nopush on;
}
