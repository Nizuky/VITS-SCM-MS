version: '3.8'
services:
  app:
    build: .
    image: scms-app:latest
    container_name: scms_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
      - ./storage/certs:/var/www/html/storage/certs:ro
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_SSL_CA=/var/www/html/storage/certs/aiven-ca.pem
    expose:
      - "9000"

  web:
    build:
      context: ./docker/nginx
    image: scms-web:latest
    container_name: scms_web
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      # Mount the application code so nginx can serve the public files from the host mount (useful for local dev)
      - ./docker/nginx/default.conf.template:/etc/nginx/conf.d/default.conf.template:ro

  db:
    image: mysql:8.0
    container_name: scms_db
    environment:
      MYSQL_DATABASE: scms
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: scms
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306"

volumes:
  db_data:
