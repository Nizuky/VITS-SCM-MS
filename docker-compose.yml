version: '3.8'
services:
  app:
    build: .
    image: scms-app:latest
    container_name: scms_app
    restart: unless-stopped
    volumes:
      - ./:/var/www/html:delegated
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    expose:
      - "9000"

  web:
    image: nginx:stable
    container_name: scms_web
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    image: mysql:8.0
    container_name: scms_db
    environment:
      MYSQL_DATABASE: scms
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: scms
      MYSQL_PASSWORD: secret
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

volumes:
  db_data:
